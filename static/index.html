<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger — Decentralized Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Decentralized Budget Tracker</h1>
            
        </header>

        <main>
            <section class="card input-card">
                <h2>Add Transaction</h2>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g., Starbucks coffee" required autocomplete="off">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">Amount ($)</label>
                            <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Category (Auto)</label>
                            <input type="text" id="category" placeholder="Predicting...">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Record Expense</button>
                </form>
            </section>

            <section class="card stats-card">
                <h2>Analytics & Forecast</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">Total Spent</span>
                        <span id="total-spent" class="stat-value">$0.00</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Predicted Next Month</span>
                        <span id="forecast-spent" class="stat-value">$0.00</span>
                    </div>
                </div>
                <div class="chart-container">
                    <span class="stat-label" style="margin-bottom: 0.5rem; display: block;">Category Breakdown</span>
                    <div id="expense-chart" class="expense-chart">
                        <p class="empty-state">No data for chart yet.</p>
                    </div>
                </div>
                <div id="budget-advice" class="advice-box" style="margin-top: 1rem;">Add transactions to receive AI budget suggestions.</div>
            </section>

            <section class="card list-card">
                <h2>Transactions</h2>
                <div id="transaction-list" class="transaction-list">
                    <p class="empty-state">No transactions recorded yet.</p>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
